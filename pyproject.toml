[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "mcp-healthcare-data-gateway"
version = "0.1.0"
description = "Policy-enforced MCP gateway for synthetic FHIR-style healthcare data"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "mcp[cli]>=2.0,<3.0",
  "pydantic>=2.10,<3.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9.0",
  "pytest-cov>=6.0,<7.0",
  "ruff>=0.9,<1.0",
]

[project.scripts]
healthcare-mcp = "app.server:main"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q --disable-warnings --maxfail=1"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

